<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Service Login | YES Emergency Services</title>
  <!-- DISCORD / SOCIAL EMBED: the card shown when this page is linked on Discord (and X, etc.).
       The image and address must be full links. If the site moves to a new domain, change https://yellonianet.vercel.app here. -->
  <meta name="description" content="The back-end for the Yellonia Police and Fire Departments. Members only.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Yellonia Emergency Services">
  <meta property="og:title" content="YES Emergency Services · Service Login">
  <meta property="og:description" content="The back-end for the Yellonia Police and Fire Departments. Members only.">
  <meta property="og:url" content="https://yellonianet.vercel.app/des/login">
  <meta property="og:image" content="https://yellonianet.vercel.app/images/embed-des.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#3f95ce">   <!-- the colored bar on the left of the Discord card -->
  <link rel="icon" href="/images/TYEcoatofarms.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/des/des.css">
</head>
<body>

<!-- ============================================================
     DES back-end: SERVICE LOGIN
     Username (Roblox username) + Badge ID + password.
     The form is handled by login.js.
     ============================================================ -->
<!-- BACKGROUND: the synapse grid, drawn by synapse.js (its settings are at the top of that file) -->
<canvas class="synapse" aria-hidden="true"></canvas>

<main class="auth-page">

  <a class="auth-brand" href="/emergency-services.html">
    <img src="/images/TYEcoatofarms.png" alt="">
    <span><strong>YES · Emergency Services</strong><span class="label">Service Login</span></span>
  </a>

  <section class="auth-card">
    <h1>Service Login</h1>
    <p>For members of the Police and Fire Departments.</p>

    <form class="form" id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" spellcheck="false" required>
        <span class="field-hint">Your Roblox username.</span>
      </div>
      <div class="field">
        <label for="badge">Badge ID</label>
        <input id="badge" name="badge" class="mono" inputmode="text" autocomplete="off" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="message" id="login-message" role="alert"></p>
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>

    <div class="auth-links">
      <a href="/des/setup.html">First time? Set up your account</a>
      <a href="/des/setup.html">Forgot your password? Reset it with Discord</a>
    </div>
  </section>

  <p class="auth-foot">Every login is recorded. Don't share your password; staff will never ask for it.</p>
</main>

<script src="/des/preview.js"></script>   <!-- TEMPORARY: the AveYellonia preview; delete this line to remove it -->
<script src="/des/des.js"></script>
<script src="/des/login.js"></script>
<script src="/des/synapse.js"></script>
</body>
</html>
