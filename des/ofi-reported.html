<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Reported Investigations | YES Emergency Services</title>
  <link rel="icon" href="/images/TYEcoatofarms.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/des/des.css">
</head>
<body>

<!-- ============================================================
     DES back-end: REPORTED INVESTIGATIONS
     OFI: fires reported by the public, waiting to be picked up.
     All five OIA/OFI list pages share cases.js; data-mode picks which list.
     ============================================================ -->
<div class="shell">

  <!-- TOP BAR -->
  <header class="topbar">
    <a class="topbar-brand" href="/des/index.html">
      <img src="/images/TYEcoatofarms.png" alt="">
      <span><strong>YES <span>/ Emergency Services</span></strong><br><span class="label">Department back-end</span></span>
    </a>
    <div class="topbar-right">
      <span class="clock" data-des="clock">--:--:--</span>
      <div class="who" data-des="who"></div>
    </div>
  </header>

  <div class="body">
    <!-- SIDE MENU: built from the member's roles by des.js -->
    <nav class="sidenav" data-des="nav" aria-label="Back-end sections"></nav>

    <!-- MAIN -->
    <main class="main" id="cases" data-mode="ofi-reported">
      <p class="label">Loading…</p>
    </main>
  </div>

  <!-- STATUS BAR -->
  <footer class="statusbar">
    <span>Every action in the back-end is recorded in the audit log.</span>
    <span style="margin-left: auto"><a href="/emergency-services.html">Public site</a></span>
  </footer>
</div>

<script src="/des/preview.js"></script>   <!-- TEMPORARY: the AveYellonia preview; delete this line to remove it -->
<script src="/des/des.js"></script>
<script src="/des/cases.js"></script>
</body>
</html>
