<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your newsroom | Yellonia News</title>
  <link rel="icon" href="images/TYEcoatofarms.png">

  <!-- FONT: swap the family here AND in style.css (--font) to change it -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <!-- NEWS FONT: the serif used on outlet and article pages -->
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body data-newsroom="home">

<!-- TOPBAR: shared by every page. To change it, edit header.js -->
<script src="header.js"></script>


<!-- ============================================================
     PAGE CONTENT
     ============================================================ -->
<main class="page newsroom-page">

  <!-- PAGE TITLE -->
  <h1>Your newsroom</h1>
  <p class="newsroom-intro">The news outlets you own or write for, and their writers.</p>

  <!-- FILLED IN BY newsroom.js: the login button, or the form / your outlets -->
  <div id="newsroom-root">
    <p class="news-loading">Loading&hellip;</p>
  </div>

</main>

<!-- FOOTER: shared by every page. To change it, edit footer.js -->
<script src="footer.js"></script>

<!-- SHARED SCRIPT: topbar hide on scroll. To change it, edit script.js -->
<script src="script.js"></script>

<!-- NEWSROOM SCRIPT: login, the register form and your outlets -->
<script src="newsroom.js"></script>

</body>
</html>
