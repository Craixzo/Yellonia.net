<!-- TOPBAR: shared by every page. To change it, edit header.js -->

<!-- ============================================================
     PAGE CONTENT: everything unique to this page goes inside <main>

  <!-- BILLS AND LAWS: filled in by legislation.js from bills.json and Centurion -->
  <section class="page bills is-loading" id="bills">
    <h1>Bills and laws</h1>
    <p class="bills-intro">Every bill brought before Parliament, and what became of it. Bills passed by Parliament become law once the Emperor signs them.</p>

    <div class="bill-tools">
      <input type="search" id="bill-search" class="bill-search" placeholder="Search bills" aria-label="Search bills">
      <div class="bill-filters" id="bill-filters" aria-label="Show"></div>
    </div>
    <p class="bill-count" id="bill-count" aria-live="polite"></p>

    <!-- THE LIST -->
    <div class="bill-list" id="bill-list">
      <p class="bill-empty">Loading bills&hellip;</p>
    </div>
  </section>

</main>
