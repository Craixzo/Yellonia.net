<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yellonia</title>
  <link rel="icon" href="images/TYEcoatofarms.png">

  <!-- FONT: swap the family here AND in style.css (--font) to change it -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<!-- TOPBAR: shared by every page. To change it, edit header.js -->
<script src="header.js"></script>


<!-- ============================================================
     PAGE CONTENT: the homepage
     ============================================================ -->
<main>

  <!-- HERO: image with the title and text centered on top of it -->
  <section class="hero">
    <img src="images/yeloria.png" alt="" width="1914" height="960">
    <div class="hero-text">
      <h1>THE EMPIRE OF YELLONIA</h1>
      <p>The official website for Yellonia.</p>
    </div>
        <!-- EXPLORE BUTTON: scrolls down to the section with id="explore" -->
    <a class="hero-explore" href="#explore">Explore</a>
  </section>

  <!-- STATS STRIP (the Explore button scrolls here) -->
  <section class="stats" id="explore">
    <ul class="stats-list">
      <li><strong data-count data-stat="roblox">1,483</strong><span>Group members</span></li>
      <li><strong data-count data-stat="discord">0</strong><span>Discord members</span></li>
      <li><strong>1643</strong><span>Year founded (in lore)</span></li>
